name: E2E Tests

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ['3.11', '3.12', '3.13']

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest test_e2e.py -v